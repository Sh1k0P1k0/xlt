name: Feature request
description: An idea for something XLT could do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Ideas are welcome! Please check the [open issues](https://github.com/boubounokefalos/xlt/issues) first, in case someone already asked.
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What XLT should do, and where (which screen or button).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and how you do it today.
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Your PSP model
      options:
        - PSP-1000
        - PSP-2000
        - PSP-3000
        - PSP Go (N1000)
        - PSP Street (E1000)
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Examples from other launchers or apps, sketches, screenshots.
